<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Maquetado</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="pagweb">

    <div class="bowl">

        <header>

            <div class="logo">

                <img class="logotype" src="./assets/images/logo.png" alt="logo de la pagina" width="50">
                <h3>Character Counter</h3>

            </div>

            <div class="powerbutton">

                <button>
                    <img src="./assets/images/luz.png" alt="imagen de boton" width="50">
                </button>

            </div>

        </header>

        <main>
            
            <h1>Analyze your text in real-time.</h1>
            <textarea name="text" id=""></textarea>

            <div class="checkboxcomponent">
                
                <div class="excluce">

                <input type="checkbox" name="Excluce Spaces" id="es">
                <p>Excluce Spaces</p>

                </div>

                <div class="character">

                <input type="checkbox" name="Set Character Limit" id="scl">
                <p>Set Character Limit</p>

                </div>

                <p class="text">Approx.reading time: < 1 minute</p>

            </div>

            <section class="stats">

                <div class="totalCharacters">
                    <span>278</span>
                    <p>Total Characters</p>
                </div>

                <div class="wordCount">
                    <span>39</span>
                    <p>Word Count </p>
                </div>

                <div class="sentenceCount">
                    <span>04</span>
                    <p>Sentence Count</p>
                </div>

            </section>

            <section class="percentage">

                <h3>Letter Density</h3>

                <div class="progressBar">
                    <ul>
                        <li>E</li>
                        <li>I</li>
                        <li>T</li>
                        <li>O</li>
                        <li>N</li>
                    </ul>
                </div>

            </section>

        </main>

    </div>

    </div>
</body>

</html>
