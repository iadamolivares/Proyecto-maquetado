<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Maquetado</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="pagweb">

        <div class="bowl">

            <header>

                <div class="logo">

                    <img class="logotype" src="./assets/images/logo.png" alt="logo de la pagina" width="50">
                    <h3>Character Counter</h3>

                </div>

                <div class="powerbutton">

                    <button>
                        <img src="./assets/images/brightness.png" alt="imagen de boton">
                    </button>

                </div>

            </header>

            <main>

                <h1>Analyze your text in real-time.</h1>
                <textarea name="text" id=""></textarea>

                <section class="checkboxcomponent">

                    <div class="exclude">

                        <input type="checkbox" name="Excluce Spaces" id="es">
                        <p>Exclude Spaces</p>

                    </div>

                    <div class="character">

                        <input type="checkbox" name="Set Character Limit" id="scl">
                        <p>Set Character Limit</p>

                    </div>

                    <p class="readingTime">Approx.reading time: < 1 minute</p>

                </section>

                <section class="stats">

                    <div class="totalCharacters">
                        <span>278</span>
                        <p>Total Characters</p>
                    </div>

                    <div class="wordCount">
                        <span>39</span>
                        <p>Word Count </p>
                    </div>

                    <div class="sentenceCount">
                        <span>04</span>
                        <p>Sentence Count</p>
                    </div>

                </section>

                <section class="percentage">

                    <h3>Letter Density</h3>

                    <div class="progressBar">

                        <div class="eProgress">
                            <p>E</p>
                            <progress value="16.06" max="100"></progress>
                            <span>40 (16.06%)</span>
                        </div>

                        <div class="iProgress">
                            <p>I</p>
                            <progress value="11.65" max="100"></progress>
                            <span>29 (11.65%)</span>
                        </div>

                        <div class="tProgress">

                            <p>T</p>
                            <progress value="11.24" max="100"></progress>
                            <span>28 (11.24%)</span>

                        </div>

                        <div class="oProgress">

                            <p>O</p>
                            <progress value="8.84" max="100"></progress>
                            <span>22 (8.84%)</span>

                        </div>

                        <div class="nProgress">

                            <p>N</p>
                            <progress value="8.43" max="100"></progress>
                            <span>21 (8.43%)</span>

                        </div>

                        <button class="btnsm">See More

                            <div class="btnimg">

                                <img src="./assets/images/angle-small-down.png" alt="">

                            </div>

                        </button>

                    </div>


                </section>

            </main>

        </div>

    </div>
</body>

</html>
